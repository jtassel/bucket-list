  </style>
</head>

}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, color, bg, border) {
  if (state.toastTimer) clearTimeout(state.toastTimer);
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.style.color = color;
  el.style.background = bg;
  el.style.border = `1px solid ${border}`;
  el.style.display = 'block';
  state.toastTimer = setTimeout(() => { el.style.display = 'none'; }, 1800);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function getCat(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[0]; }
function fmt(iso) { return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }); }
function addedTitles() { return new Set(state.items.map(i => i.title)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function filteredItems() {
  if (state.filter === 'done') return state.items.filter(i => i.completed);
  if (state.filter === 'todo') return state.items.filter(i => !i.completed);
  return state.items;
}

function inspireList() {
  const list = state.inspireTab === 'world' ? WORLD_LIST : UK_LIST;
  return state.inspireCat === 'all' ? list : list.filter(w => w.category === state.inspireCat);
}

// ── Actions ───────────────────────────────────────────────────────────────────
function addItem(overrides = {}) {
  const base = { ...state.newItem, ...overrides };
  if (!base.title.trim()) return;
  state.items.unshift({
    id: uid(), ...base, title: base.title.trim(),
    completed: false, createdAt: new Date().toISOString()
  });
  if (!overrides.title) {
    state.newItem = { title:'', category:'adventure', note:'', priority:'medium' };
    state.view = 'list';
  }
  saveData();
  render();
}

function addSuggestion(title, category, priority) {
  if (addedTitles().has(title)) return;
  state.items.unshift({ id:uid(), title, category, priority, note:'', completed:false, createdAt:new Date().toISOString() });
  saveData();
  render();
}

function toggleComplete(id) {
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  item.completed = !item.completed;
  item.completedAt = item.completed ? new Date().toISOString() : null;
  saveData();
  render();
  // flash
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if (el && item.completed) { el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 800); }
}

function deleteItem(id) {
  state.items = state.items.filter(i => i.id !== id);
  state.view = 'list';
  state.selectedId = null;
  saveData();
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function el(tag, attrs={}, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.append(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function renderHeader() {
  const items = state.items;
  const done = items.filter(i => i.completed).length;
  const pct = items.length ? Math.round(done/items.length*100) : 0;

  return el('div', {class:'header'},
    el('div', {class:'header-top'},
      el('div', {},
        el('div', {class:'header-label'}, 'MY'),
        el('div', {class:'header-title'}, 'Bucket List')
      ),
      el('div', {class:'header-btns'},
        el('button', {class:'globe-btn', title:'Browse ideas', onClick:() => { state.view='inspire'; state.inspireTab='world'; state.inspireCat='all'; render(); }}, '🌍'),
        el('button', {class:'add-btn', onClick:() => { state.view='add'; render(); setTimeout(()=>document.getElementById('new-title')?.focus(),120); }}, '+')
      )
    ),
    items.length > 0 ? el('div', {class:'progress-section'},
      el('div', {class:'progress-row'},
        el('span', {class:'progress-label'}, `${done} of ${items.length} completed`),
        el('span', {class:'progress-pct'}, `${pct}%`)
      ),
      el('div', {class:'progress-track'},
        el('div', {class:'progress-fill', style:{
          width:`${pct}%`,
          background: pct===100 ? 'linear-gradient(90deg,#5AE8A3,#3DD68C)' : 'linear-gradient(90deg,#E8825A,#E8C45A)'
        }})
      )
    ) : null,
    el('div', {class:'filters'},
      ['all','todo','done'].map(f =>
        el('button', {class:'filter-btn'+(state.filter===f?' active':''), onClick:()=>{ state.filter=f; render(); }},
          f==='all'?'All':f==='todo'?'To Do':'Done')
      )
    )
  );
}

function renderList() {
  const items = filteredItems();
  if (items.length === 0) {
    return el('div', {class:'empty'},
      el('div', {class:'empty-emoji'}, state.filter==='done'?'🎉':'🌟'),
      el('div', {class:'empty-text'},
        state.filter==='done'?'Nothing completed yet':
        state.filter==='todo'?'Nothing left to do!':
        'Your list is empty'
      ),
      state.filter==='all' ? el('div', {style:{display:'flex',flexDirection:'column',gap:'10px',alignItems:'center',marginTop:'8px'}},
        el('button', {class:'empty-inspire-btn', onClick:()=>{ state.view='inspire'; render(); }}, '🌍 Browse bucket list ideas'),
        el('button', {class:'empty-add-btn', onClick:()=>{ state.view='add'; render(); }}, '✏️ Add your own dream')
      ) : null
    );
  }

  return el('div', {class:'list-inner'},
    ...items.map(item => {
      const cat = getCat(item.category);
      const card = el('div', {
        class:'card'+(item.completed?' done':''),
        'data-id': item.id,
        onClick: () => { state.selectedId=item.id; state.view='detail'; render(); }
      },
        el('button', {
          class:'check-circle'+(item.completed?' checked':''),
          style:{'--cat-color':cat.color},
          onClick:(e)=>{ e.stopPropagation(); toggleComplete(item.id); }
        }, item.completed ? el('span',{class:'check-mark'},'✓') : null),
        el('div', {class:'card-body'},
          el('div', {class:'card-title'}, item.title),
          el('div', {class:'card-meta'},
            el('span', {class:'cat-badge', style:{background:cat.color+'22',color:cat.color}}, `${cat.emoji} ${cat.label}`),
            item.priority==='high' ? el('span',{class:'high-badge'},'🔥 High') : null
          )
        ),
        el('div', {class:'card-arrow'}, '›')
      );
      return card;
    })
  );
}

function renderInspireSheet() {
  const added = addedTitles();
  const wDone = WORLD_LIST.filter(w=>{ const it=state.items.find(i=>i.title===w.title); return it?.completed; }).length;
  const wAdded = WORLD_LIST.filter(w=>added.has(w.title)).length;
  const uDone = UK_LIST.filter(w=>{ const it=state.items.find(i=>i.title===w.title); return it?.completed; }).length;
  const uAdded = UK_LIST.filter(w=>added.has(w.title)).length;
  const list = inspireList();

  return el('div', {class:'sheet-overlay', onClick:()=>{ state.view='list'; render(); }},
    el('div', {class:'sheet', onClick:e=>e.stopPropagation()},
      el('div', {class:'sheet-handle'}),

      // Tabs
      el('div', {class:'tab-row'},
        el('button', {class:'tab'+(state.inspireTab==='world'?' active':''),
          onClick:()=>{ state.inspireTab='world'; state.inspireCat='all'; render(); }},
          '🌍 World ', el('span',{class:'tab-count'}, `${wDone}/${WORLD_LIST.length}`)
        ),
        el('button', {class:'tab'+(state.inspireTab==='uk'?' active':''),
          onClick:()=>{ state.inspireTab='uk'; state.inspireCat='all'; render(); }},
          '🇬🇧 UK ', el('span',{class:'tab-count'}, `${uDone}/${UK_LIST.length}`)
        )
      ),

      // Category chips
      el('div', {class:'chip-row'},
        el('button', {class:'chip'+(state.inspireCat==='all'?' active':''),
          onClick:()=>{ state.inspireCat='all'; render(); }}, 'All'),
        ...CATEGORIES.map(cat =>
          el('button', {
            class:'chip'+(state.inspireCat===cat.id?' active':''),
            style: state.inspireCat===cat.id ? {borderColor:cat.color,color:cat.color,background:cat.color+'1A'} : {},
            onClick:()=>{ state.inspireCat=cat.id; render(); }
          }, cat.emoji)
        )
      ),

      // Items
      el('div', {class:'inspire-list'},
        ...list.map(w => {
          const cat = getCat(w.category);
          const matchItem = state.items.find(i=>i.title===w.title);
          const isAdded = !!matchItem;
          const isDone = matchItem?.completed ?? false;

          let btnClass = 'inspire-check-btn';
          let btnText = '+';
          if (isDone)  { btnClass += ' done'; btnText = '✓'; }
          else if (isAdded) { btnClass += ' added'; btnText = '○'; }

          return el('div', {class:'inspire-card'+(isDone?' added-done':isAdded?' added-todo':'')},
            el('div', {class:'inspire-icon', style:{background:cat.color+'1A'}}, cat.emoji),
            el('div', {class:'inspire-body'},
              el('div', {class:'inspire-title'+(isDone?' done':'')}, w.title),
              el('div', {class:'inspire-meta'},
                el('span', {class:'cat-badge', style:{background:cat.color+'18',color:cat.color,fontSize:'10px'}}, cat.label),
                w.priority==='high' ? el('span',{style:{fontSize:'10px',color:'#E85A5A'}},'🔥') : null,
                isDone ? el('span',{class:'done-badge'},'Done!') : null
              )
            ),
            el('button', {
              class: btnClass,
              style: isDone
                ? {}
                : isAdded
                  ? {borderColor:cat.color, color:cat.color, background:'transparent'}
                  : {},
              onClick: () => {
                if (!isAdded) { addSuggestion(w.title, w.category, w.priority); }
                else if (matchItem) { toggleComplete(matchItem.id); }
              }
            }, btnText)
          );
        })
      )
    )
  );
}

function renderAddSheet() {
  const n = state.newItem;
  return el('div', {class:'sheet-overlay', onClick:()=>{ state.view='list'; render(); }},
    el('div', {class:'sheet', onClick:e=>e.stopPropagation()},
      el('div', {class:'sheet-handle'}),
      el('div', {class:'sheet-title'}, 'New Dream'),
      el('input', {
        id:'new-title', class:'form-input', placeholder:'What do you want to do?',
        value: n.title, maxlength:'100',
        onInput: e => { state.newItem.title=e.target.value; },
        onKeydown: e => { if(e.key==='Enter') addItem(); }
      }),
      el('div', {class:'field-label'}, 'Category'),
      el('div', {class:'cat-grid'},
        ...CATEGORIES.map(cat =>
          el('button', {
            class:'cat-option',
            style: n.category===cat.id
              ? {borderColor:cat.color,background:cat.color+'22',color:cat.color}
              : {},
            onClick:()=>{ state.newItem.category=cat.id; render(); setTimeout(()=>document.getElementById('new-title')?.focus(),0); }
          },
            el('span',{class:'cat-emoji'}, cat.emoji),
            cat.label
          )
        )
      ),
      el('div', {class:'field-label'}, 'Priority'),
      el('div', {class:'priority-row'},
        ...['low','medium','high'].map(p =>
          el('button', {
            class:'priority-btn',
            style: n.priority===p
              ? {background: p==='high'?'#E85A5A':p==='medium'?'#E8C45A':'#5AE8A3', color:'#111'}
              : {},
            onClick:()=>{ state.newItem.priority=p; render(); setTimeout(()=>document.getElementById('new-title')?.focus(),0); }
          }, (p==='high'?'🔥':p==='medium'?'⚡':'💤')+' '+p)
        )
      ),
      el('div', {class:'field-label'}, 'Note (optional)'),
      el('textarea', {
        class:'form-textarea', rows:'3', maxlength:'300',
        placeholder:'Why does this matter to you?',
        onInput: e => { state.newItem.note=e.target.value; }
      }, n.note),
      el('button', {
        class:'save-btn', disabled:!n.title.trim()||undefined,
        onClick:()=>addItem()
      }, 'Add to List')
    )
  );
}

function renderDetailSheet() {
  const item = state.items.find(i=>i.id===state.selectedId);
  if (!item) return null;
  const cat = getCat(item.category);
  return el('div', {class:'sheet-overlay', onClick:()=>{ state.view='list'; render(); }},
    el('div', {class:'sheet', onClick:e=>e.stopPropagation()},
      el('div', {class:'sheet-handle'}),
      el('div', {style:{marginBottom:'14px'}},
        el('span', {class:'cat-badge', style:{background:cat.color+'22',color:cat.color,fontSize:'13px',padding:'5px 12px'}},
          `${cat.emoji} ${cat.label}`)
      ),
      el('div', {class:'detail-title'}, item.title),
      item.note ? el('div', {class:'detail-note'}, item.note) : null,
      el('div', {class:'detail-meta'},
        el('div', {class:'meta-row'},
          el('span',{class:'meta-key'},'Priority'),
          el('span',{class:'meta-val'}, item.priority==='high'?'🔥 High':item.priority==='medium'?'⚡ Medium':'💤 Low')
        ),
        el('div', {class:'meta-row'},
          el('span',{class:'meta-key'},'Added'),
          el('span',{class:'meta-val'}, fmt(item.createdAt))
        ),
        item.completed && item.completedAt ? el('div', {class:'meta-row'},
          el('span',{class:'meta-key'},'Completed'),
          el('span',{class:'meta-val green'}, fmt(item.completedAt))
        ) : null
      ),
      el('button', {
        class:'complete-btn',
        style: item.completed
          ? {background:'rgba(255,255,255,0.08)',color:'rgba(255,255,255,0.55)'}
          : {background:`linear-gradient(135deg,${cat.color},${cat.color}bb)`,color:'#111'},
        onClick:()=>{ toggleComplete(item.id); state.view='list'; render(); }
      }, item.completed ? '↩ Mark Incomplete' : '✓ Mark Complete!'),
      el('button', {class:'delete-btn', onClick:()=>{ if(confirm('Delete this item?')) deleteItem(item.id); }}, 'Delete')
    )
  );
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const header = renderHeader();
  app.appendChild(header);

  const content = el('div', {class:'content'});
  content.appendChild(renderList());
  app.appendChild(content);

  // Measure header height for content scroll area
  requestAnimationFrame(() => {
    const h = header.getBoundingClientRect().height;
    content.style.height = `calc(100dvh - ${h}px)`;
  });

  // Sheets
  if (state.view==='inspire') app.appendChild(renderInspireSheet());
  if (state.view==='add')     app.appendChild(renderAddSheet());
  if (state.view==='detail')  app.appendChild(renderDetailSheet());

  // Toast
  const toast = el('div', {id:'toast', class:'toast', style:{display:'none'}});
  app.appendChild(toast);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadData();
render();

// ── Service Worker (inline, for offline support) ──────────────────────────────
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'bucket-list-v1';
    const FONTS = [
      'https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap'
    ];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(FONTS)).catch(()=>{}));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(cached => cached || fetch(e.request).catch(() => new Response('', {status:503})))
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
</body>
